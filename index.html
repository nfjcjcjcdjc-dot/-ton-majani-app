<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة المزرعة - Telegram Mini App</title>
    <!-- مكتبة تيليجرام الرسمية -->
    <script src="https://telegram.org"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            background-color: #5ea832;
            background-image: radial-gradient(#71bf40 15%, transparent 16%), radial-gradient(#71bf40 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* الشريط العلوي */
        .top-bar {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.35);
            padding: 5px 12px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .user-info h4 { font-size: 14px; line-height: 1.2; }
        .user-info span { font-size: 11px; color: #d1d5db; }

        /* بطاقات الأرصدة */
        .balances {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 0 15px;
            margin-top: 5px;
        }

        .balance-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.92);
            color: #1f2937;
            border-radius: 16px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }

        .balance-text strong { display: block; font-size: 15px; color: #111827; }
        .balance-text small { font-size: 11px; color: #6b7280; }

        .usdt-icon {
            width: 30px;
            height: 30px;
            background: #26a17b;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        /* ساحة المزرعة */
        .farm-area {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .barn-visual {
            font-size: 80px;
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.3));
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .chickens-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 300px;
            min-height: 60px;
            background: rgba(0, 0, 0, 0.15);
            padding: 10px;
            border-radius: 20px;
            border: 2px dashed rgba(255,255,255,0.4);
        }

        .chicken-item { font-size: 28px; animation: bounce 1.5s infinite; }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .status-pill {
            background: rgba(255, 255, 255, 0.9);
            color: #374151;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 15px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }

        /* قسم الجمع والأرباح */
        .action-panel {
            padding: 10px 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .collect-btn {
            flex: 1.2;
            background: linear-gradient(to bottom, #fcd34d, #f59e0b);
            border: 2px solid #fff;
            border-radius: 18px;
            padding: 10px;
            color: #78350f;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 0 #b45309;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.1s;
        }

        .collect-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b45309;
        }

        .collect-btn span { font-size: 11px; font-weight: 600; }

        .rate-box {
            flex: 1;
            background: rgba(255, 255, 255, 0.92);
            color: #1f2937;
            border-radius: 18px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .rate-box strong { display: block; font-size: 14px; color: #16a34a; }
        .rate-box small { font-size: 11px; color: #6b7280; }

        /* القائمة السفلية */
        .bottom-nav {
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            padding: 10px 5px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #6b7280;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .nav-item.active {
            color: #16a34a;
            background: #dcfce7;
        }

        .nav-icon { font-size: 20px; margin-bottom: 2px; }

        /* نافذة المتجر المنبثقة */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            color: #1f2937;
            width: 100%;
            max-width: 360px;
            border-radius: 24px;
            padding: 20px;
            text-align: center;
        }

        .shop-item {
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            padding: 12px;
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .buy-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-modal {
            margin-top: 10px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div>
        <div class="top-bar">
            <div class="user-profile">
                <div class="avatar" id="user-avatar">M</div>
                <div class="user-info">
                    <h4 id="user-name">Mony</h4>
                    <span id="user-handle">@FarmPlayer</span>
                </div>
            </div>
            <button onclick="addDemoBalance()" style="background:#26a17b; color:white; border:none; padding:6px 12px; border-radius:15px; font-weight:bold; cursor:pointer;">+ إيداع تجريبي</button>
        </div>

        <!-- الأرصدة -->
        <div class="balances">
            <div class="balance-card">
                <div class="balance-text">
                    <strong id="available-balance">10.00 USDT</strong>
                    <small>الرصيد المتاح</small>
                </div>
                <div class="usdt-icon">₮</div>
            </div>
            <div class="balance-card">
                <div class="balance-text">
                    <strong id="invested-balance">0.00 USDT</strong>
                    <small>إجمالي الاستثمار</small>
                </div>
                <div class="usdt-icon">₮</div>
            </div>
        </div>
    </div>

    <!-- ساحة المزرعة -->
    <div class="farm-area">
        <div class="barn-visual">🏡</div>
        <div class="chickens-grid" id="chickens-container">
            <span style="font-size: 13px; color: rgba(255,255,255,0.8);">لا يوجد دجاج في المزرعة حالياً</span>
        </div>
        <div class="status-pill" id="status-text">اشتر الدجاج لبدء كسب النقاط</div>
    </div>

    <!-- لوحة الجمع والأرباح -->
    <div>
        <div class="action-panel">
            <button class="collect-btn" onclick="collectEarnings()">
                🥚 جمع الأرباح
